<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="759" viewBox="0 0 1200 759" role="img" aria-label="Selected work: OpenHealth: Private medical assistant: QLoRA-fine-tuned Llama 3 8B, hybrid keyword and semantic retrieval over clinical guidelines with citations, five services on Docker Compose. Measured: retrieval about 0.1 s warm, 4.2 s per answer on a T4. asme-rag-harness: Clause-level retrieval evaluation over an engineering code, with abstention and a citation graph. Network-Security-Pipeline: MLOps pipeline for phishing-site detection: schema and drift checks, MLflow tracking, a FastAPI service, Docker image shipped to AWS by CI. Person-Reidentification-System: Cross-camera person re-identification API on torchreid embeddings, served with Flask. Unattended-Baggage-Detection: Flags unattended bags in video by tracking people and bags with YOLOv8 and Deep SORT. Kubernetes-Store-Provisioning-Platform: A Kubernetes operator that provisions isolated store environments: Helm, network policies, resource quotas.">
<style>@font-face{font-family:'Onest';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Onest';font-style:normal;font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Onest';font-style:normal;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}</style>
<g font-family="'Onest', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-style="normal">
<rect x="0.5" y="0.5" width="1199" height="757.84" rx="14.4" fill="#ffffff"/>
<path d="M14.4 0.5 H1185.6 A13.9 13.9 0 0 1 1199.5 14.4 V59.5 H0.5 V14.4 A13.9 13.9 0 0 1 14.4 0.5 Z" fill="#f2efea"/>
<line x1="1" y1="60.5" x2="1199" y2="60.5" stroke="#eeece8" stroke-width="1"/>
<text x="30" y="36.35" font-size="18.33" font-weight="600" fill="#7a7577" letter-spacing="1.1">REPOSITORY</text>
<text x="377.89" y="36.35" font-size="18.33" font-weight="600" fill="#7a7577" letter-spacing="1.1">WHAT IT IS</text>
<text x="30" y="154.53" font-size="23.75" font-weight="700" fill="#1f1f1f">OpenHealth</text>
<text x="377.89" y="105.17" font-size="23.06" font-weight="400" fill="#564f52">Private medical assistant: QLoRA-fine-tuned Llama 3 8B, hybrid keyword</text>
<text x="377.89" y="137.91" font-size="23.06" font-weight="400" fill="#564f52">and semantic retrieval over clinical guidelines with citations, five services</text>
<text x="377.89" y="170.65" font-size="23.06" font-weight="400" fill="#564f52">on Docker Compose. Measured: retrieval about 0.1 s warm, 4.2 s per</text>
<text x="377.89" y="203.39" font-size="23.06" font-weight="400" fill="#564f52">answer on a T4.</text>
<line x1="1" y1="230.5" x2="1199" y2="230.5" stroke="#eeece8" stroke-width="1"/>
<text x="30" y="292.74" font-size="23.75" font-weight="700" fill="#1f1f1f">asme-rag-harness</text>
<text x="377.89" y="276.13" font-size="23.06" font-weight="400" fill="#564f52">Clause-level retrieval evaluation over an engineering code, with</text>
<text x="377.89" y="308.86" font-size="23.06" font-weight="400" fill="#564f52">abstention and a citation graph.</text>
<line x1="1" y1="336.5" x2="1199" y2="336.5" stroke="#eeece8" stroke-width="1"/>
<text x="30" y="398.22" font-size="23.75" font-weight="700" fill="#1f1f1f">Network-Security-Pipeline</text>
<text x="377.89" y="381.6" font-size="23.06" font-weight="400" fill="#564f52">MLOps pipeline for phishing-site detection: schema and drift checks,</text>
<text x="377.89" y="414.34" font-size="23.06" font-weight="400" fill="#564f52">MLflow tracking, a FastAPI service, Docker image shipped to AWS by CI.</text>
<line x1="1" y1="441.5" x2="1199" y2="441.5" stroke="#eeece8" stroke-width="1"/>
<text x="30" y="488.26" font-size="23.75" font-weight="700" fill="#1f1f1f">Person-Reidentification-</text>
<text x="30" y="519.14" font-size="23.75" font-weight="700" fill="#1f1f1f">System</text>
<text x="377.89" y="487.08" font-size="23.06" font-weight="400" fill="#564f52">Cross-camera person re-identification API on torchreid embeddings,</text>
<text x="377.89" y="519.82" font-size="23.06" font-weight="400" fill="#564f52">served with Flask.</text>
<line x1="1" y1="547.5" x2="1199" y2="547.5" stroke="#eeece8" stroke-width="1"/>
<text x="30" y="593.74" font-size="23.75" font-weight="700" fill="#1f1f1f">Unattended-Baggage-</text>
<text x="30" y="624.62" font-size="23.75" font-weight="700" fill="#1f1f1f">Detection</text>
<text x="377.89" y="592.56" font-size="23.06" font-weight="400" fill="#564f52">Flags unattended bags in video by tracking people and bags with</text>
<text x="377.89" y="625.3" font-size="23.06" font-weight="400" fill="#564f52">YOLOv8 and Deep SORT.</text>
<line x1="1" y1="652.5" x2="1199" y2="652.5" stroke="#eeece8" stroke-width="1"/>
<text x="30" y="699.22" font-size="23.75" font-weight="700" fill="#1f1f1f">Kubernetes-Store-</text>
<text x="30" y="730.09" font-size="23.75" font-weight="700" fill="#1f1f1f">Provisioning-Platform</text>
<text x="377.89" y="698.04" font-size="23.06" font-weight="400" fill="#564f52">A Kubernetes operator that provisions isolated store environments: Helm,</text>
<text x="377.89" y="730.77" font-size="23.06" font-weight="400" fill="#564f52">network policies, resource quotas.</text>
<rect x="0.5" y="0.5" width="1199" height="757.84" rx="14.4" fill="none" stroke="#c2bbb0" stroke-width="1"/>
</g>
</svg>
